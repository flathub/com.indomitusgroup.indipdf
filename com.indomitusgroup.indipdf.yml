app-id: com.indomitusgroup.indipdf
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

command: indipdf

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=cups
  # Network access for downloading OCR language data on first use
  - --share=network
  # Device access for GPU (dri) and scanners (USB)
  - --device=all
  # Write access to common locations for saving PDFs
  - --filesystem=xdg-download
  - --filesystem=xdg-documents

modules:
  # SANE (Scanner Access Now Easy) for scanner support
  - name: sane-backends
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --sysconfdir=/app/etc
      - --localstatedir=/app/var
      - --with-usb
      - --disable-locking
    cleanup:
      - /share/doc
      - /share/man
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://gitlab.com/sane-project/backends/-/archive/1.4.0/backends-1.4.0.tar.gz
        sha256: 9c50ee76e35d98d7ae0cbb97d4c2a3c15663a78fdd74b0ed2bf2fe8e1a73f63a

  # CUPS client tools (lp, lpstat) for printing support
  - name: cups
    buildsystem: autotools
    config-opts:
      - --disable-systemd
      - --disable-avahi
      - --disable-launchd
      - --disable-dbus
      - --disable-pam
      - --disable-gssapi
      - --disable-ssl
      - --without-rcdir
      - --without-systemd
      - --without-xinetd
      - --without-tls
      - --localstatedir=/app/var
      - --sysconfdir=/app/etc
      - --with-menudir=/app/share/applications
      - --with-icondir=/app/share/icons
      - --with-rundir=/app/var/run/cups
      - --with-logdir=/app/var/log/cups
      - --with-cachedir=/app/var/cache/cups
    cleanup:
      - /sbin
      - /etc
      - /var
      - /lib/cups
      - /share/cups
      - /share/doc
      - /share/man
      - /share/locale
      - /share/applications
      - /share/icons
      - /bin/cups-config
      - /bin/ippeveprinter
      - /bin/ippfind
      - /bin/ipptool
      - /include
      - /lib/*.a
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/OpenPrinting/cups/releases/download/v2.4.11/cups-2.4.11-source.tar.gz
        sha256: 9a88fe1da3a29a917c3fc67ce6eb3178399d68e1a548c6d86c70d9b13651fd71

  # Ghostscript for PDF compression and PDF/A export
  - name: ghostscript
    buildsystem: autotools
    build-options:
      cflags: '-std=gnu11'
    config-opts:
      - --prefix=/app
      - --disable-cups
      - --disable-dbus
      - --disable-gtk
      - --without-x
      - --without-tesseract
      - --with-drivers=FILES
    cleanup:
      - /share/doc
      - /share/man
      - /share/ghostscript
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/ghostscript-10.04.0.tar.gz
        sha256: c764dfbb7b13fc71a7a05c634e014f9bb1fb83b899fe39efc0b6c3522a9998b1
      - type: shell
        commands:
          - rm -rf jpeg libpng tiff zlib openjpeg

  # qpdf for PDF encryption/decryption
  - name: qpdf
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cxxflags: '-include cstdint'
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DREQUIRE_CRYPTO_OPENSSL=ON
      - -DBUILD_STATIC_LIBS=OFF
    cleanup:
      - /share/doc
      - /share/man
      - /include
      - /lib/*.a
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/qpdf/qpdf/releases/download/v11.9.1/qpdf-11.9.1.tar.gz
        sha256: 2ba4d248f9567a27c146b9772ef5dc93bd9622317978455ffe91b259340d13d1

  - name: indipdf
    buildsystem: simple
    build-commands:
      - install -Dm755 indipdf ${FLATPAK_DEST}/bin/indipdf
      - install -Dm644 com.indomitusgroup.indipdf.desktop ${FLATPAK_DEST}/share/applications/com.indomitusgroup.indipdf.desktop
      - install -Dm644 com.indomitusgroup.indipdf.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.indomitusgroup.indipdf.metainfo.xml
      - install -Dm644 icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/com.indomitusgroup.indipdf.png
      - install -Dm644 icons/64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/com.indomitusgroup.indipdf.png
      - install -Dm644 icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.indomitusgroup.indipdf.png
      - install -Dm644 icons/256x256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.indomitusgroup.indipdf.png
      - install -Dm644 icons/512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.indomitusgroup.indipdf.png
    sources:
      - type: archive
        url: https://downloads.indomitusgroup.com/indipdf/indipdf-1.3.0-linux-x86_64.tar.gz
        sha256: 8f8261322b727a6799c948d502188f5928d3d450b2c44f66e051d8c245f9ba47
